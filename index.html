<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIrA DENMOK</title><style>
:root{--cyan:#54c9dc;--pale:#e9f9fc;--ink:#29434b}*{box-sizing:border-box}body{margin:0;background:#f4f8f9;color:var(--ink);font-family:system-ui,'Yu Gothic',sans-serif}header{background:white;border-bottom:3px solid var(--cyan);padding:24px max(18px,calc((100% - 980px)/2))}h1{margin:0;font-size:28px;letter-spacing:.08em}header small{color:#65909b}.wrap{max-width:980px;margin:auto;padding:22px 16px 70px}.search{width:100%;padding:16px;border:2px solid #c7e8ef;border-radius:13px;font-size:17px;background:white}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.tabs button,.action{border:1px solid #bce6ee;background:white;border-radius:12px;padding:14px 7px;font-size:15px;cursor:pointer;color:var(--ink)}.tabs button.active{background:var(--cyan);color:#073d48;border-color:var(--cyan);font-weight:700}.info{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:15px 0}.info strong{font-size:20px}.hint{font-size:13px;color:#63818b}.song{display:flex;align-items:center;gap:12px;background:white;border:1px solid #dcebef;border-radius:12px;padding:14px;margin:9px 0}.detail{flex:1;min-width:0}.title{font-weight:700;font-size:17px;overflow-wrap:anywhere}.artist{color:#64818a;margin-top:4px;font-size:14px}.tag{display:inline-block;background:#d7f6fa;color:#08778b;border-radius:5px;padding:2px 6px;font-size:11px;margin-left:6px}.heart{font-size:26px;border:0;background:none;color:#a9b8bd;cursor:pointer;padding:7px}.heart.saved{color:#e96d9a}.empty{padding:38px;text-align:center;color:#728b93;background:white;border-radius:12px}.footer{margin-top:28px;text-align:center;color:#82969c;font-size:12px}@media(max-width:570px){.tabs{grid-template-columns:repeat(2,1fr)}h1{font-size:24px}.wrap{padding-top:16px}}
</style></head><body><header><h1>KIrA DENMOK</h1><small>好きな曲を、見つけよう。</small></header><main class="wrap"><input id="search" class="search" placeholder="曲名・アーティスト名で検索" aria-label="曲名・アーティスト名で検索"><div class="tabs" id="tabs"><button data-tab="all" class="active">曲名から探す</button><button data-tab="artist">アーティストから</button><button data-tab="frequent">よく歌う曲</button><button data-tab="favorites">♥ お気に入り</button></div><div class="info"><strong id="heading">曲一覧</strong><span id="count" class="hint">読み込み中…</span></div><div id="songs" aria-live="polite"><div class="empty">曲情報を読み込んでいます…</div></div><div class="footer">人気ランキング・リクエスト機能は準備中です。<br>お気に入りはこの端末のブラウザに保存されます。</div></main><script>
const API='https://script.google.com/macros/s/AKfycbzi-H8nzZ_OW13ikLe1Ue6kHHuWEdxxEvJ79hZcSXcwbBPuDhRaPvCA5XWT0q0aW9ga/exec';
const $=id=>document.getElementById(id);let songs=[],tab='all',favorites=[];try{favorites=JSON.parse(localStorage.getItem('kira-denmok-favorites')||'[]')}catch{}
const norm=s=>String(s||'').normalize('NFKC').toLocaleLowerCase('ja-JP');
const key=s=>norm(s.titleReading||s.title);const artistKey=s=>norm(s.artistReading||s.artist);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isNew(s){if(!s.registeredAt)return false;const d=new Date(s.registeredAt);return Number.isFinite(d.getTime())&&Date.now()-d.getTime()>=0&&Date.now()-d.getTime()<30*86400000}
function render(){const q=norm($('search').value.trim());let data=songs.filter(s=>[s.title,s.artist,s.titleReading,s.artistReading].some(x=>norm(x).includes(q)));if(tab==='frequent')data=data.filter(s=>s.frequent===true);if(tab==='favorites')data=data.filter(s=>favorites.includes(String(s.id)));data.sort((a,b)=>(tab==='artist'?artistKey(a).localeCompare(artistKey(b),'ja')||key(a).localeCompare(key(b),'ja'):key(a).localeCompare(key(b),'ja')));$('heading').textContent=({all:'曲一覧',artist:'アーティスト順',frequent:'よく歌う曲',favorites:'お気に入り'})[tab];$('count').textContent=`${data.length}曲 / 登録 ${songs.length}曲`;$('songs').innerHTML=data.length?data.map(s=>`<article class="song"><div class="detail"><div class="title">${escapeHTML(s.title)}${isNew(s)?'<span class="tag">NEW</span>':''}</div><div class="artist">${escapeHTML(s.artist)}</div></div><button class="heart ${favorites.includes(String(s.id))?'saved':''}" data-id="${escapeHTML(s.id)}" aria-label="お気に入り切替" title="お気に入り">♥</button></article>`).join(''):'<div class="empty">該当する曲がありません</div>'}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});$('search').addEventListener('input',render);$('songs').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;const id=b.dataset.id;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];try{localStorage.setItem('kira-denmok-favorites',JSON.stringify(favorites))}catch{}render()});
(async()=>{try{const response=await fetch(API,{redirect:'follow'});if(!response.ok)throw Error('HTTP '+response.status);const payload=await response.json();if(!Array.isArray(payload.songs))throw Error('曲データ形式が不正です');songs=payload.songs.filter(s=>s.id&&s.title&&s.artist);render()}catch(e){$('count').textContent='取得できませんでした';$('songs').innerHTML='<div class="empty">曲データを読み込めませんでした。<br>Google Apps Scriptの公開設定、またはブラウザの通信制限を確認してください。<br><small>※ ブラウザによっては別ドメインへのアクセスが制限されます。</small></div>';console.error(e)}})();
</script></body></html>
